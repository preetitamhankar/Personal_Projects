[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quantitative-health-research-portfolio"
version = "0.1.0"
description = "Reproducible synthetic examples in network epidemiology and biomedical data science"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "matplotlib>=3.7",
  "networkx>=3.1",
]

[tool.setuptools]
packages = []

